<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Nhập Học - KPI Kingdom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Roboto+Slab:wght@500;700&display=swap');
        
        body {
            /* 2. ÁP DỤNG FONT MỚI CHO TOÀN TRANG */
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #eaf2e3; 
            overflow-x: hidden;
        }
        
        /* 3. CLASS FONT TIÊU ĐỀ MỚI */
        .fantasy-font { 
            font-family: 'Roboto Slab', serif; 
        }

        /* --- CÁC CLASS CŨ GIỮ NGUYÊN --- */
        .content-card {
            background: rgba(255, 255, 255, 0.98);
            border: 2px solid #d4af37;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25);
            border-radius: 1rem;
        }

        .marquee-container {
            background: rgba(44, 62, 80, 0.9);
            border-bottom: 2px solid #d4af37;
            color: #f1c40f;
        }

        /* --- HIỆU ỨNG GALAXY & TUYẾT RƠI (Đã giữ lại code cũ của bạn) --- */
        #hall-of-fame-box {
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            border: 2px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            position: relative;
            overflow: hidden; 
        }

        #hall-of-fame-box::before,
        #hall-of-fame-box::after {
            content: "";
            position: absolute;
            top: -200px; left: -200px; right: -200px; bottom: -200px;
            pointer-events: none;
        }

        /* Tuyết lớp 1 (Nhỏ, Gió nhẹ) */
        #hall-of-fame-box::before {
            background-image: url('data:image/svg+xml,%3Csvg version="1.1" xmlns="http://www.w3.org/2000/svg" width="100px" height="100px"%3E%3Ccircle cx="10" cy="10" r="1" fill="white" opacity="0.6"/%3E%3Ccircle cx="40" cy="30" r="1.5" fill="white" opacity="0.5"/%3E%3Ccircle cx="70" cy="15" r="1" fill="white" opacity="0.4"/%3E%3Ccircle cx="20" cy="60" r="1.2" fill="white" opacity="0.6"/%3E%3Ccircle cx="80" cy="80" r="1.5" fill="white" opacity="0.5"/%3E%3C/svg%3E');
            background-size: 100px 100px;
            animation: snow-wind-1 15s linear infinite;
        }

        /* Tuyết lớp 2 (To, Gió mạnh, Xéo hơn) */
        #hall-of-fame-box::after {
            background-image: url('data:image/svg+xml,%3Csvg version="1.1" xmlns="http://www.w3.org/2000/svg" width="150px" height="150px"%3E%3Ccircle cx="25" cy="25" r="2.5" fill="white" opacity="0.8"/%3E%3Ccircle cx="100" cy="40" r="2" fill="white" opacity="0.6"/%3E%3Ccircle cx="50" cy="100" r="3" fill="white" opacity="0.7"/%3E%3C/svg%3E');
            background-size: 150px 150px;
            animation: snow-wind-2 10s linear infinite;
        }

        @keyframes snow-wind-1 {
            0% { background-position: 0px 0px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { background-position: 100px 400px; opacity: 0; }
        }

        @keyframes snow-wind-2 {
            0% { background-position: 0px 0px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { background-position: 200px 500px; opacity: 0; }
        }

        /* Hiệu ứng tàn tro bay lên (Cho tháp) */
        @keyframes ember-rise {
            0% { background-position: 0 100px; opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { background-position: 20px 0; opacity: 0; }
        }
        
        /* Card cho Tower Rank */
        .tower-card {
            background: rgba(0, 0, 0, 0.6);
            border-left: 4px solid #ef4444; /* Viền đỏ */
            transition: all 0.3s;
        }
        .tower-card:hover {
            background: rgba(239, 68, 68, 0.1);
            transform: translateX(5px);
        }

        /* Style thẻ bài Galaxy */
        .rank-card-galaxy {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .rank-card-galaxy:hover {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            transform: translateY(-5px);
        }
        .rank-card-galaxy.rank-1 {
            background: linear-gradient(145deg, #2c2c54, #474787);
            border: 2px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.7);
        }
        /* bng thông báo*/
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            animation: marquee 20s linear infinite;
        }
        .system-tag {
            color: #ff4444; /* Màu đỏ */
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="w-full h-12 flex items-center marquee-container fixed top-0 z-50 backdrop-blur-sm shadow-md bg-black/30">
        <div class="px-4 font-bold text-yellow-400 whitespace-nowrap flex items-center border-r border-yellow-600/50 pr-4">
            <i class="fas fa-scroll mr-2 text-lg animate-pulse"></i> 
            <span class="fantasy-font tracking-wider">THÔNG BÁO:</span>
        </div>
        
        <marquee id="system-marquee-content" class="text-sm text-yellow-100 font-mono py-2 flex-1" scrollamount="6" onmouseover="this.stop();" onmouseout="this.start();">
            Server đang tải dữ liệu thông báo...
        </marquee>
    </header>

    <div class="flex-1 flex items-center justify-center p-4 pt-20 pb-10">
        <div class="max-w-7xl w-full flex justify-center">
            
            <div class="w-full flex flex-col gap-6">
                
                <div class="content-card p-6 w-full max-w-sm mx-auto shadow-xl">
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 bg-amber-100 rounded-full mx-auto flex items-center justify-center mb-3 border-2 border-yellow-600 shadow-sm">
                            <span class="text-3xl">🏰</span>
                        </div>
                        <h1 class="text-2xl font-bold text-amber-900 fantasy-font">ĐĂNG NHẬP</h1>
                        <p class="text-xs text-amber-700 mt-1 font-semibold">Học giả đại chiến</p>
                    </div>

                    <form id="loginForm" class="space-y-5">
                        <div>
                            <label class="text-xs font-bold text-amber-800 uppercase tracking-wide">Tên Định Danh</label>
                            <div class="relative mt-1">
                                <i class="fas fa-user absolute left-3 top-3 text-amber-500"></i>
                                <input type="text" id="username" class="w-full pl-10 pr-4 py-2.5 rounded-lg border-2 border-amber-200 focus:border-yellow-600 outline-none text-sm font-mono bg-amber-50/50 text-amber-900 font-semibold transition-colors" placeholder="Nhập username...">
                            </div>
                        </div>

                        <div>
                            <label class="text-xs font-bold text-amber-800 uppercase tracking-wide">Mật Khẩu</label>
                            <div class="relative mt-1">
                                <i class="fas fa-lock absolute left-3 top-3 text-amber-500"></i>
                                <input type="password" id="password" class="w-full pl-10 pr-4 py-2.5 rounded-lg border-2 border-amber-200 focus:border-yellow-600 outline-none text-sm font-mono bg-amber-50/50 text-amber-900 font-semibold transition-colors" placeholder="••••••••">
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-gradient-to-r from-yellow-600 to-amber-700 hover:from-yellow-700 hover:to-amber-800 text-white font-bold py-3 rounded-lg shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 text-sm uppercase tracking-wider">
                            <span>TIẾN VÀO</span> <i class="fas fa-dungeon"></i>
                        </button>
                        <p id="errorMsg" class="text-red-600 text-center text-sm font-bold hidden bg-red-100 p-2 rounded border border-red-300"></p>
                    </form>
                </div>

            </div> </div>
    </div>

    <footer class="text-center text-amber-800/70 text-xs py-4 font-semibold">
        KPI Kingdom v3.0 &copy; 2024 | Designed for Heroes
    </footer>

    <script>
        // --- LOGIC 1: ĐĂNG NHẬP (Đã sửa lỗi phân quyền) ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.add('hidden');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (response.ok) {
                    // 1. Lưu Token (Cốt lõi)
                    let token = data.access_token || data.token;
                    if(token) localStorage.setItem('access_token', token);

                    // 2. Lưu thông tin User (⚠️ ĐÂY LÀ CHỖ QUAN TRỌNG CẦN KHÔI PHỤC)
                    if(data.user_info) {
                        // Lưu theo kiểu mới (để Admin dùng)
                        localStorage.setItem('user_info', JSON.stringify(data.user_info));
                        
                        // 👇 KHÔI PHỤC CÁC KEY CŨ (Để Player Dashboard nhận diện được)
                        localStorage.setItem('username', data.user_info.username);
                        localStorage.setItem('kpi_username', data.user_info.username); // Dashboard cần cái này!
                        localStorage.setItem('kpi_role', data.user_info.role);         // Dashboard cần cái này!
                    }

                    // 3. Logic phân luồng (Cập nhật thêm nhánh cho Phụ huynh)
                    const role = data.user_info?.role;

                    if (role === 'admin') {
                        alert("🫡 Chào sếp! Đang vào trang quản trị...");
                        window.location.href = 'admin.html';
                    } 
                    else if (role === 'parent') {
                        // 👇 NHÁNH MỚI CHO PHỤ HUYNH 👇
                        window.location.href = 'parent.html'; 
                    } 
                    else {
                        // Học sinh vào thẳng Hành trình tri thức
                        window.location.href = 'study-spire.html'; 
                    }
                    
                } else {
                    errorMsg.innerText = "❌ " + (data.detail || "Sai thông tin đăng nhập");
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err); // In lỗi ra console để dễ soi
                errorMsg.innerText = "⚠️ Lỗi kết nối Server!";
                errorMsg.classList.remove('hidden');
            }
        });

        // --- LOGIC 2: các bảng xếp hạng công khai đã được gỡ khỏi trang đăng nhập ---
        async function checkMaintenanceLogin() {
            try {
                const res = await fetch('/api/data/maintenance-status');
                const data = await res.json();

                // Nếu đang bảo trì -> Hiện màn hình chặn ngay lập tức
                if (data.is_maintenance) {
                    document.body.innerHTML = `
                        <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:#111827; color:white; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:9999;">
                            <i class="fas fa-tools" style="font-size:4rem; color:#f59e0b; margin-bottom:20px;"></i>
                            <h1 style="font-size:2.5rem; font-weight:bold; color:#f59e0b;">HỆ THỐNG ĐANG BẢO TRÌ</h1>
                            <p style="font-size:1.2rem; margin-top:10px; color:#d1d5db; max-width:600px; text-align:center;">
                                ${data.message || "Vui lòng quay lại sau ít phút..."}
                            </p>
                        </div>
                    `;
                }
            } catch (err) {
                console.error("Lỗi check bảo trì:", err);
            }
        }
        // Chạy ngay khi mở trang web
        checkMaintenanceLogin();

        // khu vực gọi bảng thông báo từ admin
        document.addEventListener("DOMContentLoaded", async () => {
            // Gọi hàm tải thông báo ngay khi web load xong
            await loadSystemNotifications();
        });

        async function loadSystemNotifications() {
            try {
                // 1. Gọi API lấy thông báo hệ thống
                const res = await fetch('/api/noti/public');
                const notisData = res.ok ? await res.json() : [];

                // -----------------------------------------------------
                // A. XỬ LÝ CHẠY CHỮ (MARQUEE) - LOGIC MỚI MAX 5
                // -----------------------------------------------------
                
                // Bước 1: Chuẩn hóa danh sách Thông báo Hệ thống
                let systemMsgs = notisData
                    .filter(n => n.type === 'marquee')
                    .map(n => ({
                        content: n.content,
                        source: 'SYSTEM', // Đánh dấu nguồn
                        time: new Date(n.created_at).getTime(),
                        color: 'text-yellow-100' // Màu chữ mặc định
                    }));

                // Bước 2: (Chờ tính năng Chat) Giả lập Chat Thế Giới 
                // Sau này bạn gọi API chat ở đây rồi gộp vào mảng worldMsgs
                let worldMsgs = []; 
                // Ví dụ: worldMsgs = [{ content: "Hello anh em!", source: "Hùng Ca", time: Date.now(), color: "text-green-300" }];

                // Bước 3: GỘP 2 NGUỒN LẠI
                let allMessages = [...systemMsgs, ...worldMsgs];

                // Bước 4: SẮP XẾP & CẮT LẤY 5 TIN MỚI NHẤT
                // Sắp xếp thời gian giảm dần (Mới nhất -> Cũ nhất)
                allMessages.sort((a, b) => b.time - a.time);
                
                // Cắt lấy 5 tin đầu tiên
                const top5Messages = allMessages.slice(0, 5);

                // Bước 5: HIỂN THỊ
                const marqueeEl = document.getElementById('system-marquee-content');
                if (marqueeEl) {
                    if (top5Messages.length > 0) {
                        const htmlContent = top5Messages.map(msg => {
                            // Tạo prefix: [HỆ THỐNG] hoặc [TÊN PLAYER]
                            const prefix = msg.source === 'SYSTEM' 
                                ? '<span class="text-red-400 font-bold">[HỆ THỐNG]</span>' 
                                : `<span class="text-blue-400 font-bold">[${msg.source}]</span>`;
                            
                            return `${prefix} <span class="${msg.color}">${msg.content}</span>`;
                        }).join(' &nbsp;&nbsp;&nbsp;✦&nbsp;&nbsp;&nbsp; '); // Ngăn cách bằng dấu sao
                        
                        marqueeEl.innerHTML = htmlContent;
                    } else {
                        marqueeEl.innerHTML = '<span class="text-gray-400">Chào mừng đến với KPI Kingdom!</span>';
                    }
                }

                // -----------------------------------------------------
                // B. XỬ LÝ POPUP (Giữ nguyên logic cũ)
                // -----------------------------------------------------
                const popupList = notisData.filter(n => n.type === 'popup');
                if (popupList.length > 0) {
                    checkAndShowPopup(popupList[0]); // Popup mới nhất (do Backend đã sort)
                }

            } catch (error) {
                console.error("Lỗi tải thông báo:", error);
            }
        }

        // Hàm kiểm tra và hiện Popup
        function checkAndShowPopup(popupData) {
            // Kiểm tra xem người dùng đã tích "Không hiện lại" chưa
            // Key lưu trong localStorage ví dụ: hide_popup_12 (12 là ID thông báo)
            const storageKey = `hide_popup_${popupData.id}`;
            const hiddenUntil = localStorage.getItem(storageKey);
            const now = new Date().getTime();

            // Nếu có hạn chặn và chưa hết hạn -> KHÔNG HIỆN
            if (hiddenUntil && now < parseInt(hiddenUntil)) {
                console.log("Popup đã bị chặn hiển thị bởi người dùng.");
                return;
            }

            // Nếu được phép hiện -> Bật Modal lên
            const modal = document.getElementById('sys-notification-modal');
            const content = document.getElementById('sys-noti-content');
            
            if (modal && content) {
                // Gán ID hiện tại vào modal để lát nữa nút đóng biết đường mà lưu chặn
                modal.dataset.popupId = popupData.id; 
                
                content.innerHTML = popupData.content; // Hỗ trợ HTML (in đậm, màu sắc...)
                modal.classList.remove('hidden');
            }
        }
        // đóng popup thông báo
        function closeSysNoti() {
            const modal = document.getElementById('sys-notification-modal');
            const checkbox = document.getElementById('sys-noti-check');
            const popupId = modal.dataset.popupId; // Lấy ID từ dataset gán lúc nãy

            // Nếu người dùng tích vào ô "Không hiện lại"
            if (checkbox && checkbox.checked && popupId) {
                const oneDay = 24 * 60 * 60 * 1000; // 24 giờ tính bằng mili giây
                const expiryTime = new Date().getTime() + oneDay;
                
                // Lưu vào LocalStorage: key="hide_popup_ID", value="thời điểm hết hạn"
                localStorage.setItem(`hide_popup_${popupId}`, expiryTime);
                console.log(`Đã chặn popup ID ${popupId} trong 24h.`);
            }

            // Ẩn modal
            if (modal) modal.classList.add('hidden');
        }
    </script>
        <div id="sys-notification-modal" class="fixed inset-0 bg-black bg-opacity-80 z-[100] hidden flex items-center justify-center backdrop-blur-sm transition-opacity duration-300">
        
        <div class="bg-gray-800 border-2 border-yellow-500 rounded-xl shadow-[0_0_30px_rgba(234,179,8,0.3)] w-11/12 md:w-1/2 lg:w-1/3 max-h-[80vh] flex flex-col relative transform scale-95 transition-all duration-300">
            
            <div class="bg-gradient-to-r from-yellow-700 to-yellow-600 p-4 rounded-t-lg flex justify-between items-center border-b border-yellow-500">
                <h3 class="text-white font-bold text-lg uppercase tracking-wider flex items-center">
                    <i class="fas fa-envelope-open-text mr-2 animate-bounce"></i>
                    Thông Báo Từ BQT
                </h3>
                <button onclick="closeSysNoti()" class="text-yellow-200 hover:text-white transition">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <div id="sys-noti-content" class="p-6 text-gray-200 overflow-y-auto text-base leading-relaxed min-h-[100px] break-words">
                Đang tải nội dung...
            </div>

            <div class="p-4 border-t border-gray-700 bg-gray-900 rounded-b-lg flex flex-col md:flex-row justify-between items-center gap-4">
                
                <label class="flex items-center space-x-2 cursor-pointer text-gray-400 hover:text-white select-none group">
                    <div class="relative">
                        <input type="checkbox" id="sys-noti-check" class="peer sr-only">
                        <div class="w-5 h-5 border-2 border-gray-500 rounded peer-checked:bg-yellow-500 peer-checked:border-yellow-500 transition"></div>
                        <i class="fas fa-check text-black absolute top-0.5 left-0.5 opacity-0 peer-checked:opacity-100 text-xs"></i>
                    </div>
                    <span class="group-hover:text-yellow-400 transition text-sm">Không hiện lại trong 24h</span>
                </label>

                <button onclick="closeSysNoti()" class="bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-2 px-6 rounded shadow-lg transform active:scale-95 transition w-full md:w-auto flex items-center justify-center">
                    <i class="fas fa-check-circle mr-2"></i> ĐÃ ĐỌC
                </button>
            </div>
        </div>
    </div>
</body>
</html>
